/* ===== RESET ===== */

*,*::before,*::after{

/* ===== BACKGROUND ===== */

.bg-layer{

position:fixed;
inset:0;
pointer-events:none;
z-index:0;

}

.bg-stars{

background:
radial-gradient(1px 1px at 10% 15%,rgba(255,255,255,.6),transparent),
radial-gradient(1px 1px at 40% 8%,rgba(255,255,255,.7),transparent),
radial-gradient(1px 1px at 70% 18%,rgba(255,255,255,.4),transparent),
radial-gradient(1px 1px at 90% 10%,rgba(255,255,255,.5),transparent),

background-color:#000010;

}

.bg-glow-blue{

background:
radial-gradient(
ellipse at bottom,
rgba(20,60,160,.35),
transparent 70%);

}

/* ===== ORB ===== */

.orb{

position:fixed;
border-radius:50%;
filter:blur(60px);
animation:float 10s ease-in-out infinite alternate;
z-index:0;

}

.orb-1{

width:280px;
height:280px;
background:rgba(60,100,220,.18);
top:-80px;
right:-60px;

}

.orb-2{

width:200px;
height:200px;
background:rgba(180,130,40,.12);
bottom:40px;
left:-40px;

}

@keyframes float{

from{

transform:
translate(0,0)
scale(1);

}

to{

transform:
translate(20px,-30px)
scale(1.1);

}

}

/* ===== LAYOUT ===== */

#menu-page{

position:relative;
min-height:100vh;

display:flex;

<script>


const data = [

{ key: "演習1", link: "exercize1/index.html" },
{ key: "演習2", link: "exercize2/index.html" },
{ key: "演習3", link: "exercize3/index.html" },
{ key: "演習4", link: "exercize4/index.html" },
{ key: "演習5", link: "exercize5/index.html" },

{ key: "演習7", link: "exercize7/index.html" },
{ key: "演習8", link: "exercize8/index.html" },
{ key: "演習9", link: "exercize9/index.html" },
{ key: "演習10", link: "exercize10/index.html" },
{ key: "演習11", link: "exercize11/index.html" },
{ key: "演習12", link: "exercize12/index.html" },
{ key: "演習13", link: "exercize13/index.html" },
{ key: "演習14", link: "exercize14/index.html" },

{ key: "統計力学", link: "../index.html" },
{ key: "講義", link: "../lecture/index.html" },
{ key: "演習", link: "../exercize/index.html" }

];

const input = document.getElementById("search");
const suggest = document.getElementById("suggest");

input.addEventListener("input", () => {

    const q = input.value.trim();

    suggest.innerHTML = "";

    if(!q){

        suggest.style.display = "none";
        return;

    }

    const result = data.filter(item =>
        item.key.includes(q)
    );

    if(result.length === 0){

        suggest.style.display = "none";
        return;

    }

    result.forEach(item=>{

        const div = document.createElement("div");

        div.className = "suggest-item";

        div.textContent = item.key;

        div.onclick = () => {

            location.href = item.link;

        };

        suggest.appendChild(div);

    });

    suggest.style.display = "flex";

});

document.addEventListener("click", (e) => {

    if(!e.target.closest(".search-wrap")){

        suggest.style.display = "none";

    }

});

</script>
