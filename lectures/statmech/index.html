<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>統計力学</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    background:
    radial-gradient(circle at top,
    #2b2b2b 0%,
    #0b0f14 45%,
    #000000 100%);

    color:white;

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

    padding:
    calc(90px + env(safe-area-inset-top))
    20px
    30px;

}

/* ===== 戻るボタン ===== */

.back-btn{

    position:fixed;

    top:calc(20px + env(safe-area-inset-top));

    left:20px;

    z-index:9999;

    border:none;

    padding:12px 20px;

    border-radius:16px;

    background:#ffd700;

    color:#000;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
    0 0 15px rgba(255,215,0,.5);

    transition:.25s;

}

.back-btn:hover{

    transform:scale(1.05);

    box-shadow:
    0 0 25px rgba(255,215,0,.8);

}

/* ===== タイトル ===== */

.header{

    text-align:center;

    margin-bottom:45px;

}

.header h1{

    color:#ffd700;

    font-size:2.3rem;

    margin-bottom:10px;

    text-shadow:
    0 0 10px rgba(255,215,0,.7),
    0 0 30px rgba(255,215,0,.4);

}

.header p{

    opacity:.8;

    font-size:15px;

}

/* ===== メニュー ===== */

.menu{

    padding:22px;

    margin:18px 0;

    border-radius:22px;

    background:
    linear-gradient(
    135deg,
    #ffd700,
    #b8860b);

    color:#000;

    font-weight:bold;

    font-size:1.15rem;

    text-align:center;

    cursor:pointer;

    transition:.25s;

    box-shadow:
    0 0 20px rgba(255,215,0,.2);

}

.menu:hover{

    transform:
    translateY(-4px);

    box-shadow:
    0 0 30px rgba(255,215,0,.45);

}

</style>
</head>

<body>

<button
class="back-btn"
onclick="location.href='../../index.html'">

← ホーム

</button>

<div class="header">

<h1>📊 統計力学</h1>

<p>

閲覧するコンテンツを選択してください

</p>

</div>

<div
class="menu"
onclick="location.href='lecture/index.html'">

📖 講義

</div>

<div
class="menu"
onclick="location.href='exercise/index.html'">

📝 演習

</div>

</body>
</html>
