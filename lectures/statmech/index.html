<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physics Hub — Statistical Mechanics</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap');

/* ===== RESET ===== */
*, *::before, *::after{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#000;
    color:#e8dfc8;

    font-family:'Noto Sans JP',sans-serif;

    min-height:100vh;

    overflow-x:hidden;

}

/* ===== BACKGROUND ===== */

.bg-layer{

    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;

}

.bg-stars{

    background:
    radial-gradient(1px 1px at 10% 15%,rgba(255,255,255,.6),transparent),
    radial-gradient(1px 1px at 40% 8%,rgba(255,255,255,.7),transparent),
    radial-gradient(1px 1px at 70% 18%,rgba(255,255,255,.4),transparent),
    radial-gradient(1px 1px at 90% 10%,rgba(255,255,255,.5),transparent),
    radial-gradient(1px 1px at 35% 85%,rgba(255,255,255,.4),transparent);

    background-color:#000010;

}

.bg-glow-blue{

    background:
    radial-gradient(
    ellipse at bottom,
    rgba(20,60,160,.35),
    transparent 70%);

}

/* ===== ORB ===== */

.orb{

    position:fixed;

    border-radius:50%;

    filter:blur(60px);

    animation:float 10s ease-in-out infinite alternate;

    z-index:0;

}

.orb-1{

    width:280px;
    height:280px;

    background:rgba(60,100,220,.18);

    top:-80px;
    right:-60px;

}

.orb-2{

    width:200px;
    height:200px;

    background:rgba(180,130,40,.12);

    bottom:40px;
    left:-40px;

}

@keyframes float{

from{

transform:translate(0,0) scale(1);

}

to{

transform:translate(20px,-30px) scale(1.1);

}

}

/* ===== LAYOUT ===== */

#menu-page{

    position:relative;

    min-height:100vh;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    padding:
    calc(70px + env(safe-area-inset-top))
    20px
    40px;

    z-index:10;

}

/* ===== BACK ===== */

.back-button{

    position:fixed;

    top:calc(20px + env(safe-area-inset-top));

    left:20px;

    padding:10px 18px;

    border-radius:30px;

    border:1px solid rgba(200,170,80,.45);

    background:rgba(0,0,0,.45);

    color:#e8dfc8;

    cursor:pointer;

    transition:.25s;

    backdrop-filter:blur(10px);

    z-index:999;

}

.back-button:hover{

    background:rgba(80,150,255,.15);

    border-color:#c8aa50;

}

/* ===== HEADER ===== */

.menu-header{

    text-align:center;

    margin-bottom:22px;

}

.menu-eyebrow{

    font-family:'Cinzel',serif;

    font-size:11px;

    letter-spacing:.35em;

    color:rgba(200,170,80,.75);

}

.menu-title-main{

    font-family:'Cinzel',serif;

    font-size:clamp(28px,5vw,48px);

    background:
    linear-gradient(
    180deg,
    #fff8e8,
    #c8aa50,
    #8a6e20);

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;

}

/* ===== SEARCH ===== */

.search-wrap{

    width:100%;

    max-width:420px;

    margin:20px 0 30px;

    position:relative;

}

.search-box{

    width:100%;

    padding:12px 14px;

    background:rgba(0,0,0,.45);

    border:1px solid rgba(200,170,80,.3);

    color:#e8dfc8;

    outline:none;

}

.suggest-box{

    position:absolute;

    top:48px;

    width:100%;

    display:none;

    flex-direction:column;

    background:rgba(10,10,20,.95);

    border:1px solid rgba(200,170,80,.25);

}

.suggest-item{

    padding:10px;

    cursor:pointer;

}

.suggest-item:hover{

    background:rgba(80,150,255,.15);

}

/* ===== MENU ===== */

.menu-list{

    width:100%;

    max-width:560px;

    display:flex;

    flex-direction:column;

    gap:8px;

}

.menu-item{

    position:relative;

    display:flex;

    align-items:center;

    cursor:pointer;

}

.mi-bg{

    position:absolute;

    inset:0;

    opacity:0;

    transition:.25s;

    background:
    linear-gradient(
    90deg,
    rgba(80,150,255,0),
    rgba(80,150,255,.2),
    rgba(80,150,255,0));

}

.menu-item:hover .mi-bg{

    opacity:1;

}

.mi-num{

    width:40px;

    text-align:right;

    font-family:'Cinzel',serif;

    color:rgba(200,170,80,.6);

}

.mi-body{

    flex:1;

    padding:14px 10px;

}

.mi-round{

    font-size:10px;

    letter-spacing:.3em;

    color:rgba(200,170,80,.6);

}

.mi-title{

    font-size:18px;

}
/* ===== FOOTER ===== */

.menu-footer{

    margin-top:40px;

    font-size:10px;

    letter-spacing:.3em;

    color:rgba(200,170,80,.25);

}

</style>
</head>

<body>

<div class="bg-layer bg-stars"></div>
<div class="bg-layer bg-glow-blue"></div>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<button
class="back-button"
onclick="location.href='../../index.html'">

← HOME

</button>

<div id="menu-page">

    <div class="menu-header">

        <div class="menu-eyebrow">

            Physics Hub

        </div>

        <div class="menu-title-main">

            Statistical Mechanics

        </div>

    </div>

    <!-- SEARCH -->

    <div class="search-wrap">

        <input
        id="search"
        class="search-box"
        type="text"
        placeholder="Search...">

        <div
        id="suggest"
        class="suggest-box">
        </div>

    </div>

    <!-- MENU -->

    <div class="menu-list">

        <div
        class="menu-item"
        onclick="location.href='lecture/index.html'">

            <div class="mi-bg"></div>

            <div class="mi-num">

                01

            </div>

            <div class="mi-body">

                <div class="mi-round">

                    LECTURE

                </div>

                <div class="mi-title">

                    講義

                </div>

            </div>

        </div>

        <div
        class="menu-item"
        onclick="location.href='exercize/index.html'">

            <div class="mi-bg"></div>

            <div class="mi-num">

                02

            </div>

            <div class="mi-body">

                <div class="mi-round">

                    EXERCISE

                </div>

                <div class="mi-title">

                    演習

                </div>

            </div>

        </div>

    </div>

    <div class="menu-footer">

        Physics Navigation System

    </div>

</div>

<script>

const data = [

    {

        key:"講義",

        link:"lecture/index.html"

    },

    {

        key:"Lecture",

        link:"lecture/index.html"

    },

    {

        key:"演習",

        link:"exercise/index.html"

    },

    {

        key:"Exercise",

        link:"exercise/index.html"

    }

];

const input=document.getElementById("search");

const suggest=document.getElementById("suggest");

input.addEventListener("input",()=>{

    const q=input.value.trim().toLowerCase();

    suggest.innerHTML="";

    if(!q){

        suggest.style.display="none";

        return;

    }

    const res=data.filter(d=>

        d.key.toLowerCase().includes(q)

    );

    if(res.length===0){

        suggest.style.display="none";

        return;

    }

    res.forEach(r=>{

        const div=document.createElement("div");

        div.className="suggest-item";

        div.textContent=r.key;

        div.onclick=()=>location.href=r.link;

        suggest.appendChild(div);

    });

    suggest.style.display="flex";

});

document.addEventListener("click",(e)=>{

    if(!e.target.closest(".search-wrap")){

        suggest.style.display="none";

    }

});

</script>

</body>
</html>
